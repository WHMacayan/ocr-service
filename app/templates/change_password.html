{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div><h1>Change password</h1><p>The admin password protects this page. Changing it signs out every other browser.</p></div>
</div>
<form class="card" method="post" style="max-width:560px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="card-body">
    <div class="field"><label for="current">Current password</label>
      <input type="password" id="current" name="current" autocomplete="current-password" required autofocus></div>
    <div class="field" style="margin-top:16px"><label for="password">New password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8"
             placeholder="At least 8 characters"></div>
    <div class="field" style="margin-top:16px"><label for="confirm">Repeat the new password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8"></div>
    <div class="actions" style="margin-top:24px"><button class="btn">Change password</button>
      <a class="btn ghost" href="{{ url_for('web.settings') }}">Cancel</a></div>
  </div>
</form>
{% endblock %}

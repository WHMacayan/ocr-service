services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 4 "app:create_app()"
    ports:
      # This PC only: other computers on the network cannot open the page.
      - "127.0.0.1:8000:8000"
    volumes:
      - ocr-data:/data
      # The one folder Freight Payables may write its workbooks in (app/payables/exports.py). None is
      # shared here: docker-compose.override.yml on each PC or server shares its own folder at /exports
      # and names it in PAYABLES_EXPORT_HOST (see the deployment guide).
      - &exports
        type: bind
        source: ./exports
        target: /exports
        bind:
          create_host_path: true
    environment: &exports_env
      PAYABLES_EXPORT_HOST: ""
    # The local Odoo answers at katana.local on this PC (hosts file -> nginx on port 80).
    extra_hosts: &hosts
      - "katana.local:host-gateway"
    restart: unless-stopped
    logging: &logging
      options:
        max-size: "10m"
        max-file: "5"

  # One worker per mailbox purpose, side by side: a backlog in one never delays the others.
  # Each reads its own mailboxes and processes their files (WORKER_PURPOSES, app/worker.py).
  worker:
    build: .
    volumes:
      - ocr-data:/data
    environment:
      WORKER_PURPOSES: freight_booking
    extra_hosts: *hosts
    restart: unless-stopped
    logging: *logging

  bills-worker:
    build: .
    volumes:
      - ocr-data:/data
    environment:
      WORKER_PURPOSES: bill_matching
    extra_hosts: *hosts
    restart: unless-stopped
    logging: *logging

  customs-worker:
    build: .
    volumes:
      - ocr-data:/data
    environment:
      WORKER_PURPOSES: customs_entry
    extra_hosts: *hosts
    restart: unless-stopped
    logging: *logging

  # Freight Payables mailboxes only, in their own process: a slow payables run never delays the others.
  payables-worker:
    build: .
    command: flask --app app payables-worker
    volumes:
      - ocr-data:/data
      - *exports
    environment: *exports_env
    extra_hosts: *hosts
    restart: unless-stopped
    logging: *logging

volumes:
  ocr-data:
